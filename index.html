<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100c24"><title>Cool Games — Oyna, keşfet, eğlen</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#f5f2ff;background:#100c24}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#100c24eb;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff15;padding:16px 5%;display:flex;gap:20px;align-items:center;flex-wrap:wrap}.logo{font-size:25px;font-weight:950;letter-spacing:-1px;color:#fff}.logo span{color:#a68aff}.search{background:#211a3a;color:#fff;border:1px solid #3d315b;border-radius:13px;padding:12px 16px;flex:1;min-width:180px;outline:none}.wrap{max-width:1300px;margin:auto;padding:32px 5%}.hero{padding:40px;border-radius:25px;background:radial-gradient(circle at 85% 30%,#8151e9 0,transparent 45%),linear-gradient(120deg,#32205e,#17132f);border:1px solid #6842b7}.hero h1{font-size:clamp(32px,5vw,60px);margin:0 0 12px}.hero p{color:#ded5f4;max-width:650px;line-height:1.6}.cta{border:0;background:#a78bfa;color:#130d29;border-radius:12px;padding:13px 20px;font-weight:800}.chips{display:flex;gap:10px;overflow:auto;padding:25px 0}.chip{background:#221b3c;border:1px solid #40335f;color:#e8dfff;padding:10px 16px;border-radius:999px;white-space:nowrap}.chip.active{background:#a78bfa;color:#160e2c}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}h2{font-size:25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:18px}.game{border:1px solid #3a2d57;background:#201936;border-radius:18px;overflow:hidden;text-align:left;color:inherit;padding:0;transition:transform .2s,border-color .2s}.game:hover{transform:translateY(-5px);border-color:#ac89ff}.art{height:145px;display:flex;align-items:center;justify-content:center;font-size:65px;background:linear-gradient(135deg,var(--a),var(--b));position:relative}.art small{position:absolute;bottom:10px;left:10px;font-size:11px;font-weight:800;background:#120b25aa;border-radius:8px;padding:5px 8px}.info{padding:14px}.info strong{display:block;font-size:17px}.info p{font-size:12px;color:#c5b7e0;margin:6px 0 0}.overlay{display:none;position:fixed;inset:0;z-index:10;background:#0c0920;padding:14px}.overlay.show{display:flex;flex-direction:column}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 8px 14px}.bar button{background:#30234e;border:1px solid #624a91;color:white;border-radius:10px;padding:9px 14px}.player{flex:1;min-height:0;position:relative;background:#15112a;border-radius:14px;overflow:hidden}.player iframe,.player canvas{width:100%;height:100%;border:0;display:block}.notice{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:#1a1331}.notice p{max-width:500px;line-height:1.6;color:#cbbde7}.hidden{display:none!important}footer{padding:50px 5%;text-align:center;color:#a79abc}.empty{padding:30px;color:#c6b6e3}@media(max-width:600px){.hero{padding:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:115px}.info strong{font-size:14px}.wrap{padding:20px 4%}}
</style></head><body><header><div class="logo">🎮 COOL <span>GAMES</span></div><input id="search" class="search" placeholder="Oyun ara..." aria-label="Oyun ara"></header><main class="wrap"><section class="hero"><h1>OYUNUN YENİ ADRESİ 🚀</h1><p>3D, parkur ve online oyunları keşfet. Oyun ekranın Cool Games içinde açılır; yeni sekmeye gitmene gerek yok.</p><button class="cta" id="featured">▶ Hemen oyna</button></section><nav class="chips" id="chips" aria-label="Kategoriler"></nav><div class="heading"><h2>🔥 Oyunları keşfet</h2><span id="count"></span></div><section class="grid" id="grid"></section></main><footer>© 2026 Cool Games • Bağımsız oyun portalı • Oyun markaları ilgili sahiplerine aittir.</footer><section class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Oyun oynatıcı"><div class="bar"><strong id="playerTitle">Oyun</strong><div><button id="fullscreen">⛶ Tam ekran</button> <button id="close">✕ Kapat</button></div></div><div class="player" id="player"></div></section><script>
// Yeni oyun eklemek için buraya yalnızca sahibinin izin verdiği gerçek embed URL'sini girin.
const games=[
{id:'runner',title:'Neon Runner 3D Style',cat:'Parkur',emoji:'🏃',a:'#8b5cf6',b:'#ec4899',kind:'local',desc:'Cool Games özel mini oyunu • Çalışır'},
{id:'minefun',title:'MineFun.io',cat:'Online',emoji:'⛏️',a:'#16a34a',b:'#0f766e',kind:'embed',url:'https://www.miniplay.com/embed/minefun-io',desc:'Çok oyunculu • Yayıncı embed bağlantısı'},
{id:'bloxd',title:'Bloxd.io',cat:'3D',emoji:'🧱',a:'#2563eb',b:'#7c3aed',kind:'pending',desc:'Embed izni / bağlantısı bekleniyor'},
{id:'cars',title:'3D Araba Yarışı',cat:'Yarış',emoji:'🏎️',a:'#e11d48',b:'#f97316',kind:'pending',desc:'Oyun ekleniyor'},
{id:'parkour',title:'3D Parkur',cat:'Parkur',emoji:'🌆',a:'#0ea5e9',b:'#4338ca',kind:'pending',desc:'Oyun ekleniyor'},
{id:'battle',title:'Online Savaş',cat:'Aksiyon',emoji:'⚔️',a:'#dc2626',b:'#7c2d12',kind:'pending',desc:'Oyun ekleniyor'},
{id:'football',title:'3D Futbol',cat:'Spor',emoji:'⚽',a:'#16a34a',b:'#14532d',kind:'pending',desc:'Oyun ekleniyor'},
{id:'sandbox',title:'Sandbox Dünyası',cat:'3D',emoji:'🌍',a:'#0891b2',b:'#1e40af',kind:'pending',desc:'Oyun ekleniyor'}
];
let category='Tümü';const grid=document.querySelector('#grid'),chips=document.querySelector('#chips'),search=document.querySelector('#search');const categories=['Tümü','3D','Online','Parkur','Yarış','Aksiyon','Spor'];function render(){chips.innerHTML=categories.map(c=>`<button class="chip ${c===category?'active':''}" data-cat="${c}">${c}</button>`).join('');let list=games.filter(g=>(category==='Tümü'||g.cat===category)&&g.title.toLocaleLowerCase('tr').includes(search.value.toLocaleLowerCase('tr')));document.querySelector('#count').textContent=list.length+' oyun';grid.innerHTML=list.length?list.map(g=>`<button class="game" data-id="${g.id}"><div class="art" style="--a:${g.a};--b:${g.b}">${g.emoji}<small>${g.kind==='local'?'OYNANABİLİR':g.kind==='embed'?'EMBED':'YAKINDA'}</small></div><div class="info"><strong>${g.title}</strong><p>${g.desc}</p></div></button>`).join(''):'<p class="empty">Bu kategoride eşleşen oyun bulunamadı.</p>';}chips.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){category=b.dataset.cat;render()}});grid.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openGame(b.dataset.id)});search.addEventListener('input',render);document.querySelector('#featured').onclick=()=>openGame('runner');
let stopGame=()=>{};const overlay=document.querySelector('#overlay'),player=document.querySelector('#player');function openGame(id){stopGame();const g=games.find(x=>x.id===id);if(!g)return;document.querySelector('#playerTitle').textContent=g.title;player.innerHTML='';overlay.classList.add('show');document.body.style.overflow='hidden';if(g.kind==='embed'){const frame=document.createElement('iframe');frame.src=g.url;frame.title=g.title;frame.allow='fullscreen; autoplay; gamepad';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';player.append(frame)}else if(g.kind==='local'){startRunner()}else{const n=document.createElement('div');n.className='notice';n.innerHTML='<h2>🎮 Bu oyun hazırlanıyor</h2><p>Bu oyunu Cool Games içinde açabilmek için oyun sahibinin izin verdiği embed bağlantısı veya lisanslı HTML5 oyun dosyası gerekiyor. Yeni sekme açılmayacak.</p><button class="cta" id="backGames">Oyunlara dön</button>';player.append(n);n.querySelector('button').onclick=closeGame;}}function closeGame(){stopGame();player.innerHTML='';overlay.classList.remove('show');document.body.style.overflow=''}document.querySelector('#close').onclick=closeGame;document.querySelector('#fullscreen').onclick=()=>{if(!document.fullscreenElement)player.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('show'))closeGame()});
function startRunner(){const canvas=document.createElement('canvas');player.append(canvas);const ctx=canvas.getContext('2d');let alive=true,raf=0,score=0,lane=1,obstacles=[],last=0,speed=5,gameOver=false;function resize(){canvas.width=player.clientWidth*devicePixelRatio;canvas.height=player.clientHeight*devicePixelRatio}resize();window.addEventListener('resize',resize);function move(e){if(e.key==='ArrowLeft'||e.key==='a')lane=Math.max(0,lane-1);if(e.key==='ArrowRight'||e.key==='d')lane=Math.min(2,lane+1);if(e.key===' '&&gameOver)reset()}function tap(e){if(gameOver){reset();return}lane=e.clientX<innerWidth/2?Math.max(0,lane-1):Math.min(2,lane+1)}function reset(){score=0;speed=5;obstacles=[];gameOver=false;last=0}window.addEventListener('keydown',move);canvas.addEventListener('pointerdown',tap);function draw(t){if(!alive)return;const w=canvas.width,h=canvas.height,scale=devicePixelRatio;ctx.fillStyle='#140f32';ctx.fillRect(0,0,w,h);const horizon=h*.29;let grad=ctx.createLinearGradient(0,horizon,0,h);grad.addColorStop(0,'#312061');grad.addColorStop(1,'#080816');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(w*.44,horizon);ctx.lineTo(w*.56,horizon);ctx.lineTo(w*.95,h);ctx.lineTo(w*.05,h);ctx.fill();ctx.strokeStyle='#a78bfa88';ctx.lineWidth=2*scale;for(let i=0;i<4;i++){let x=w*(.05+i*.3);ctx.beginPath();ctx.moveTo(w*.44+i*w*.04,horizon);ctx.lineTo(x,h);ctx.stroke()}let shift=(t*.0003*speed)%1;for(let i=0;i<12;i++){let z=((i/12+shift)%1);let y=horizon+(h-horizon)*z*z;ctx.strokeStyle='#8b5cf655';ctx.beginPath();ctx.moveTo(w*(.44-.39*z),y);ctx.lineTo(w*(.56+.39*z),y);ctx.stroke()}const centers=[.27,.5,.73];if(!gameOver){if(t-last>950){last=t;obstacles.push({lane:Math.floor(Math.random()*3),z:0})}obstacles.forEach(o=>o.z+=.006*speed);obstacles=obstacles.filter(o=>o.z<1.2);score+=.025;speed=Math.min(11,5+score/160)}for(const o of obstacles){let z=o.z,yy=horizon+(h-horizon)*z*z,xx=w*(.5+(centers[o.lane]-.5)*z*1.9),s=(15+75*z)*scale;ctx.fillStyle='#fb7185';ctx.fillRect(xx-s/2,yy-s,s,s);ctx.fillStyle='#fecdd3';ctx.fillRect(xx-s/2,yy-s,s,.17*s);if(z>.89&&z<1.06&&o.lane===lane)gameOver=true}let px=w*centers[lane],py=h*.82,r=28*scale;ctx.fillStyle='#a78bfa';ctx.shadowColor='#a78bfa';ctx.shadowBlur=25*scale;ctx.fillRect(px-r,py-r,r*2,r*2);ctx.shadowBlur=0;ctx.fillStyle='white';ctx.font=`bold ${22*scale}px sans-serif`;ctx.fillText('PUAN '+Math.floor(score),20*scale,35*scale);ctx.font=`${15*scale}px sans-serif`;ctx.fillText('← → veya A D ile hareket et • Mobilde sağa/sola dokun',20*scale,60*scale);if(gameOver){ctx.fillStyle='#100b28dc';ctx.fillRect(0,0,w,h);ctx.textAlign='center';ctx.fillStyle='white';ctx.font=`bold ${36*scale}px sans-serif`;ctx.fillText('OYUN BİTTİ',w/2,h/2);ctx.font=`${18*scale}px sans-serif`;ctx.fillText('Tekrar başlamak için dokun veya boşluk tuşuna bas',w/2,h/2+40*scale);ctx.textAlign='left'}raf=requestAnimationFrame(draw)}raf=requestAnimationFrame(draw);stopGame=()=>{alive=false;cancelAnimationFrame(raf);window.removeEventListener('resize',resize);window.removeEventListener('keydown',move);canvas.removeEventListener('pointerdown',tap);stopGame=()=>{}}}render();
</script></body></html>
